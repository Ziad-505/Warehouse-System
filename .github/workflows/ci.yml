name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: warehouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://warehouse:localdev@localhost:5432/warehouse_test?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # setup-node's `cache: npm` caches the npm DOWNLOAD cache, which was
      # already hitting -- 109 MB restored at 200 MB/s. The five minutes went on
      # npm unpacking and linking 329 packages, most of that Prisma's engine
      # binaries. Caching node_modules itself skips that work entirely.
      #
      # The key pins the OS and Node major alongside the lockfile hash, because
      # argon2 is a native module and its binary is not portable between them.
      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test